[project]
name = "tag-firing-qa-suite"
version = "0.1.0"
description = "Automated QA suite that verifies analytics/marketing tags fire correctly, using Playwright network interception."
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.47,<2.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
